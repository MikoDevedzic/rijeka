# CI — what a pull request must pass before it can merge to main.
# Backend tests (no database, no network), frontend build and registry contract
# tests; branch protection on main requires those three plus the integration
# tests and the self-host smoke.
# Three more run alongside: the API-level integration tests on a postgres:16
# service built by backend/stack (the pinned sample book among them), the
# browser journeys on the same stack (frontend/e2e), and the self-host smoke
# (docker compose config, then db + migrate up). Making a job required is a
# branch-protection setting, not a change here.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff
        # Lint before the tests: pyflakes, bugbear, pyupgrade (backend/ruff.toml). Fails on any finding.
        run: ruff check .
      - name: pytest
        # No database in CI: db/session.py only needs the variable to exist, and
        # the tests that touch Postgres (tests/integration) skip here and run in the integration job on the stack.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
          RIJEKA_CHAIN_DEV_SEED: ci
        run: python -m pytest -q -p no:cacheprovider
      - name: the production watch's own tests
        # .github/scripts/watch.py must fail when production is wrong: each check is given a good answer, then a broken one
        run: |
          ruff check --config ruff.toml ../.github/scripts
          python -m pytest -q -p no:cacheprovider ../.github/scripts
  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -- --quiet          # errors only: an undefined variable is a crash the build does not catch
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci
          VITE_API_URL: https://api.example.test
  contract:
    name: registry contract tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: chain } }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }   # chain/lib/forge-std (pinned in .gitmodules / foundry.lock)
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: stable }
      - run: forge build --sizes
      - run: forge test -vv
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rijeka
          POSTGRES_PASSWORD: rijeka
          POSTGRES_DB: rijeka_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rijeka -d rijeka_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # the stack: a throwaway database on the service container, a local key set, every hosted switch off
      RIJEKA_STACK_DATABASE_URL: postgresql://rijeka:rijeka@127.0.0.1:5432/rijeka_test
      DATABASE_URL: postgresql://rijeka:rijeka@127.0.0.1:5432/rijeka_test
      RIJEKA_JWKS_FILE: ${{ github.workspace }}/backend/stack/.local/jwks.json
      SUPABASE_URL: http://stack.local
      RIJEKA_DEMO_PROVISION: "0"
      RIJEKA_SCHEDULER: "0"
      RIJEKA_DEMO_MARKET_DATA: "0"
      RIJEKA_CHAIN_DEV_SEED: ci-stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: schema (auth stub, docs/schema.sql, docs/migrations in date order)
        run: python -m stack.apply
      - name: seed (two users, one firm, market data for the template account)
        run: python -m stack.seed
      - name: keys (ES256 keypair and the JWKS the API reads)
        run: python -m stack.keys
      - name: pytest -m integration
        run: python -m pytest -q -p no:cacheprovider -m integration tests/integration
  journeys:
    name: browser journeys
    # Quinn (.claude/agents/quinn.md): the built app on the local stack, in a real browser. Every page opens without
    # an error; the rates, FX and digital-asset tickets are priced, run through XVA with the on-chain comparison,
    # capital, booking and confirmation; the results fit a laptop screen. Then the same stack with a local test chain
    # (anvil): a confirmation anchored for real and read back from the node. frontend/e2e/README.md.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rijeka
          POSTGRES_PASSWORD: rijeka
          POSTGRES_DB: rijeka_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rijeka -d rijeka_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RIJEKA_STACK_DATABASE_URL: postgresql://rijeka:rijeka@127.0.0.1:5432/rijeka_test
      PYTHON: python
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: PostgREST (the reads the app makes through supabase-js, on the stack database)
        run: |
          curl -fsSL -o /tmp/postgrest.tar.xz https://github.com/PostgREST/postgrest/releases/download/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz
          sudo tar -xJf /tmp/postgrest.tar.xz -C /usr/local/bin postgrest
          postgrest --version
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - uses: foundry-rs/foundry-toolchain@v1      # anvil, for the journey that confirms on a chain
        with: { version: stable }
      - name: journeys
        run: npm run e2e
        working-directory: frontend
      - name: journeys on a chain
        # the same stack with a local test chain (anvil) and the registry deployed to it: a trade is confirmed, the
        # transaction is read back from the node, and the public register lists it (frontend/e2e/chain)
        run: npm run e2e:chain
        working-directory: frontend
      - name: logs and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-journeys
          path: |
            frontend/e2e/.out/*.log
            frontend/e2e/.out/results
            frontend/e2e/.out/report
          retention-days: 7
  selfhost:
    name: self-host smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config
        # the file parses, every variable resolves, the images are named
        run: cp .env.selfhost.example .env.selfhost && docker compose --env-file .env.selfhost config --quiet
      - name: db + migrate
        # builds the backend image, starts Postgres, applies the schema and the minimal seed; the
        # migrate service exits 0 only when apply.py and seed.py did
        run: |
          cp .env.selfhost.example .env.selfhost
          docker compose --env-file .env.selfhost up --build --exit-code-from migrate --abort-on-container-exit db migrate
      - name: logs on failure
        if: failure()
        run: docker compose --env-file .env.selfhost logs --no-color db migrate
      - name: down
        if: always()
        run: docker compose --env-file .env.selfhost down -v
