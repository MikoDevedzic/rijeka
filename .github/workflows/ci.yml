# CI — what a pull request must pass before it can merge to main.
# Three independent jobs: backend tests (no database, no network), frontend
# build, registry contract tests. Branch protection requires all three.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        # No database in CI: db/session.py only needs the variable to exist, and
        # every test that would touch Postgres skips without .env.test.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
          RIJEKA_CHAIN_DEV_SEED: ci
        run: python -m pytest -q -p no:cacheprovider
  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci
          VITE_API_URL: https://api.example.test
  contract:
    name: registry contract tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: chain } }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }   # chain/lib/forge-std (pinned in .gitmodules / foundry.lock)
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: stable }
      - run: forge build --sizes
      - run: forge test -vv
