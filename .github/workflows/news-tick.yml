# Drives the NEWS room: POST /api/news/tick every 30 minutes.
# Secrets: RIJEKA_API_URL (e.g. https://rijeka-api.onrender.com),
#          RIJEKA_CRON_SECRET (same value as the backend's env var).
# A hosted backend on a sleeping free tier is woken by this call too.
name: news-tick
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      RIJEKA_API_URL: ${{ secrets.RIJEKA_API_URL || 'https://rijeka-api.onrender.com' }}
      RIJEKA_CRON_SECRET: ${{ secrets.RIJEKA_CRON_SECRET }}
    steps:
      - name: tick
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST "$RIJEKA_API_URL/api/news/tick" -H "X-Rijeka-Cron: $RIJEKA_CRON_SECRET" --max-time 120)
          cat /tmp/out; echo; test "$code" = "200"
      - name: news summaries (in-app, own words, original linked)
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST "$RIJEKA_API_URL/api/news/summarize?limit=12" -H "X-Rijeka-Cron: $RIJEKA_CRON_SECRET" --max-time 280)
          cat /tmp/out; echo; test "$code" = "200"
      - name: fx and crypto spot
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST "$RIJEKA_API_URL/api/currency/spot/tick" -H "X-Rijeka-Cron: $RIJEKA_CRON_SECRET" --max-time 60)
          cat /tmp/out; echo; test "$code" = "200"
      - name: demo market data (public sources, daily rebuild)
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST "$RIJEKA_API_URL/api/market-data/demo/tick" -H "X-Rijeka-Cron: $RIJEKA_CRON_SECRET" --max-time 240)
          cat /tmp/out; echo; test "$code" = "200"
      - name: end of day P&L (marks and attributed rows, every account)
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST "$RIJEKA_API_URL/api/pnl/eod/tick" -H "X-Rijeka-Cron: $RIJEKA_CRON_SECRET" --max-time 280)
          echo "eod: $code $(head -c 400 /tmp/out)"
      - name: market risk (ladder, VaR, stress, limits; stored per account)
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST "$RIJEKA_API_URL/api/risk/daily/tick" -H "X-Rijeka-Cron: $RIJEKA_CRON_SECRET" --max-time 280)
          echo "risk: $code $(head -c 400 /tmp/out)"
