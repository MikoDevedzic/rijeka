# Keeps the frontend from running ahead of the API (the outside copy).
#
# Netlify builds app.rijeka.app from the `release` branch, not from main. This job asks the
# live API which commit it is running (Render sets RENDER_GIT_COMMIT; GET /api/ops/health
# reports it) and moves `release` to that commit. So a push to main deploys the API first
# (Render, after CI), and the frontend follows once the API is actually serving that commit.
# A failed API deploy leaves the frontend where it was.
#
# The API does the same move itself at startup when RIJEKA_GITHUB_TOKEN is set on Render
# (backend/scheduler.py); that is the path that runs on time. GitHub runs this schedule on a
# best-effort basis (on 2026-10-30 it did not fire once in a day), so it is the backstop and the
# manual button, not the driver. It is a schedule rather than a job in ci.yml because Render
# waits for the commit's checks before deploying, and a check that waits for Render would never end.
name: release-sync
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: move release to the commit the API is serving
        env:
          API: ${{ secrets.RIJEKA_API_URL || 'https://rijeka-api.onrender.com' }}
        run: |
          main=$(git rev-parse origin/main)
          release=$(git rev-parse origin/release 2>/dev/null || echo none)
          live=$(curl -s --max-time 30 "$API/api/ops/health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit") or "")' 2>/dev/null || true)
          echo "main=$main release=$release live=$live"
          if [ -z "$live" ]; then echo "the API reports no commit yet"; exit 0; fi
          if ! git cat-file -e "$live^{commit}" 2>/dev/null; then echo "live commit unknown to this clone"; exit 0; fi
          if ! git merge-base --is-ancestor "$live" "$main"; then echo "live commit is not on main"; exit 0; fi
          # Render skips a commit that touches only the frontend, the landing site or docs (render.yaml
          # buildFilter), so the API keeps serving an older commit while main is ahead on frontend-only
          # work. Those commits are safe for the frontend to take: move release to main's head when
          # everything between the live commit and main is outside the API. (Until 2 November 2026 the
          # job returned early when release already sat at the live commit, so a frontend-only or
          # docs-only push never reached the app through this job.)
          target="$live"
          if [ "$live" != "$main" ]; then
            changed=$(git diff --name-only "$live" "$main")
            api=$(printf '%s\n' "$changed" | grep -vE '^(frontend/|netlify_drop/|docs/|\.github/)' | grep -vE '\.md$' || true)
            if [ -z "$api" ]; then target="$main"; echo "main is ahead of the API on frontend/docs only: release follows main"; fi
          fi
          if [ "$release" = "$target" ]; then echo "release already at $target"; exit 0; fi
          git push --force origin "$target:refs/heads/release"
          echo "release -> $target"
