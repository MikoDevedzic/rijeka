[pytest]
# Collect only the real suite. backend/ root contains scratch scripts named
# test_*.py (test_snap, test_snap2, test_calibrate) that execute Bloomberg
# snap calls at import time; without a blpapi install those raise during
# collection and abort the entire run before a single real test executes.
testpaths = tests
norecursedirs = .venv venv node_modules .git __pycache__

markers =
    integration: adversarial cross-tenant tests that hit a running backend
