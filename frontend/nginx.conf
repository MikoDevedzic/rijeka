# The self-hosted app: static build, SPA catch-all, GoTrue under /auth/v1, the API under /api.
# Service names are docker-compose.yml's (auth:9999, api:8000).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GoTrue serves its routes at its root (/token, /signup, /user, /.well-known/jwks.json); the app and the
    # API address it as <origin>/auth/v1/..., the Supabase shape, so the prefix is stripped here.
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Convenience: the API on the same origin. The build's VITE_API_URL decides what the app actually calls.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /version.json { add_header Cache-Control "no-store"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
