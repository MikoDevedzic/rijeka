services:
  - type: web
    name: rijeka-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: trust Render's X-Forwarded-* so client IPs / https are right
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    region: virginia     # same AWS region as the Supabase project (aws-1-us-east-1): ~1 ms to the DB
    plan: 1c-2g          # 1 CPU / 2 GB. Pricing is numpy/scipy on the request path; the 0.5c-512mb
                         # plan is viable for a quiet instance, `free` sleeps and is not for a launch.
    autoDeployTrigger: checksPass   # deploy main only after the GitHub CI checks pass
    healthCheckPath: /health
    envVars:
      # ── required ──────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false          # Supabase > Connect > "Transaction pooler" URI (port 6543, IPv4);
                             # the direct host is IPv6-only and Render has no IPv6 egress
      - key: FRONTEND_URL
        value: https://app.rijeka.app
      - key: CORS_ORIGINS
        value: https://rijeka-landing.netlify.app
      - key: PYTHON_VERSION
        value: 3.11.11
      # ── hosted demo ───────────────────────────────────────────────────
      - key: RIJEKA_DEMO_PROVISION
        value: "1"           # every sign-in gets a sandbox workspace (api/routes/demo.py)
      - key: RIJEKA_DEMO_TEMPLATE_EMAIL
        sync: false          # whose market data new visitors get a copy of
      - key: RIJEKA_CHAIN_DEV_SEED
        generateValue: true  # keys for DEMO* entities only (see next line); never reuse a local seed
      - key: RIJEKA_CHAIN_DEV_LEI_PREFIX
        value: DEMO          # Rijeka signs for demo entities only; real LEIs need a countersignature
      - key: RIJEKA_CHAIN_DAILY_LIMIT
        value: "20"          # anchoring actions per user per 24h, protects the relayer
      - key: RIJEKA_CRON_SECRET
        generateValue: true  # POST /api/news/tick (X-Rijeka-Cron header); copy into the GitHub secret
      # ── Sepolia anchoring ─────────────────────────────────────────────
      - key: RIJEKA_CHAIN_RPC
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: RIJEKA_CHAIN_REGISTRY
        value: "0x920AE5AC65f72CB58af5bD3eF48168d9151dEd6e"
      - key: RIJEKA_CHAIN_EXPLORER
        value: https://sepolia.etherscan.io
      - key: RIJEKA_CHAIN_RELAYER_KEY
        sync: false          # funded Sepolia burner; rotate if it ever appears in a log
      - key: RIJEKA_CHAIN_KEY_254900OPPU84GM83MG36
        sync: false          # signing key for RIJEKA CAPITAL (real LEI): the DEMO-only seed does not cover it
      # ── optional: Prometheus (read-only desk assistant) ───────────────
      - key: ANTHROPIC_API_KEY
        sync: false          # leave blank to run without it; the chat then says it is not configured
      # ── optional: Telegram mirror (chain/README.md) ───────────────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: RIJEKA_PUBLIC_URL
        value: https://app.rijeka.app
